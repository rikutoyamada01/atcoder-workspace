name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Bump Version & Create Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run prepare-release script
        id: prepare
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          node scripts/prepare-release.js "$RELEASE_TYPE"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Git configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Release Branch
        id: git_push
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          BRANCH_NAME="release/v$VERSION"
          git checkout -b "$BRANCH_NAME"
          git add package.json manifest.json CHANGELOG.md src/changelog.json pages/
          git commit -m "chore(release): bump version to v$VERSION"
          git push origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.git_push.outputs.branch }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh pr create \
            --base master \
            --head "$HEAD_BRANCH" \
            --title "Release v$VERSION" \
            --body-file release-pr-body.md
