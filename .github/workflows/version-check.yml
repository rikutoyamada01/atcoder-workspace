name: Version Sync & Bump Check

on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check-version:
    name: Check version sync and bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify repository-wide version synchronization
        run: npm run version:check

      - name: Get PR version
        id: pr_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR Version is: $VERSION"

      - name: Checkout base branch (master/main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base-branch

      - name: Get base branch version
        id: base_version
        run: |
          if [ -f "./base-branch/package.json" ]; then
            VERSION=$(node -p "require('./base-branch/package.json').version")
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Base Branch Version is: $VERSION"

      - name: Compare versions (only if package.json or manifest.json changed)
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          if echo "$CHANGED_FILES" | grep -qE "^(package\.json|manifest\.json)$"; then
            PR_VER="${{ steps.pr_version.outputs.version }}"
            BASE_VER="${{ steps.base_version.outputs.version }}"
            if [ "$PR_VER" = "$BASE_VER" ]; then
              echo "::error file=package.json::package.json / manifest.json version ($PR_VER) has not been bumped from the base branch version ($BASE_VER)!"
              exit 1
            else
              echo "Success: Version successfully bumped from $BASE_VER to $PR_VER"
            fi
          else
            echo "Version files were not modified in this PR. Skipping version bump assertion."
          fi
